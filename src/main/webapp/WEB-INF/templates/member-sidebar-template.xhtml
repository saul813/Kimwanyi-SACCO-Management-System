<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <title><ui:insert name="title">Member Portal - Kimwanyi SACCO</ui:insert></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet library="css" name="custom-style.css"/>
    <style>
        .member-app-container { display:flex; min-height:100vh; }
        .member-sidebar { width:250px; background:#0d6efd; color:#fff; padding:20px 0; flex-shrink:0; }
        .member-sidebar-brand { font-size:20px; font-weight:800; text-align:center; padding-bottom:20px; border-bottom:1px solid rgba(255,255,255,0.25); margin-bottom:20px; }
        .member-sidebar-menu { display:flex; flex-direction:column; gap:6px; padding:0 10px; }
        .member-sidebar-link { color:#e9f2ff; text-decoration:none; padding:12px 15px; border-radius:8px; font-weight:600; display:block; }
        .member-sidebar-link:hover { background:rgba(255,255,255,0.14); color:#fff; }
        .member-main-workspace { flex-grow:1; background:#f8f9fa; display:flex; flex-direction:column; }
        .member-topbar { min-height:65px; background:#fff; border-bottom:1px solid #dee2e6; display:flex; justify-content:space-between; align-items:center; padding:0 30px; }
        .member-content-body { padding:30px; flex-grow:1; }
        .member-card { background:#fff; border:1px solid #dee2e6; border-radius:10px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.04); }
        .member-card h3 { margin:0 0 16px 0; color:#212529; }
        .simple-table { width:100%; border-collapse:collapse; }
        .simple-table th, .simple-table td { padding:10px; border-bottom:1px solid #dee2e6; text-align:left; }
        .status-pill { display:inline-block; padding:4px 8px; border-radius:999px; background:#fff3cd; color:#664d03; font-size:13px; font-weight:700; }
        .info-row { display:flex; justify-content:space-between; gap:16px; padding:12px 0; border-bottom:1px solid #dee2e6; font-size:15px; }
        .info-label { color:#6c757d; font-weight:500; }
        .info-value { color:#212529; font-weight:700; text-align:right; }
        @media (max-width: 800px) {
            .member-app-container { flex-direction:column; }
            .member-sidebar { width:100%; }
            .member-sidebar-menu { flex-direction:row; flex-wrap:wrap; }
        }
    </style>
</h:head>
<h:body>
    <h:messages id="memberTemplateMsg"
                globalOnly="false"
                style="position:fixed; top:15px; right:15px; z-index:9999; list-style:none; padding:0; margin:0; max-width:360px;"
                errorStyle="display:block; background:#f8d7da; color:#842029; border:1px solid #f5c2c7; border-radius:8px; padding:10px 12px; margin-bottom:8px;"
                infoStyle="display:block; background:#d1e7dd; color:#0f5132; border:1px solid #badbcc; border-radius:8px; padding:10px 12px; margin-bottom:8px;"
                warnStyle="display:block; background:#fff3cd; color:#664d03; border:1px solid #ffecb5; border-radius:8px; padding:10px 12px; margin-bottom:8px;"/>

    <div class="member-app-container">
        <aside class="member-sidebar">
            <div class="member-sidebar-brand">Member Portal</div>
            <nav class="member-sidebar-menu">
                <h:outputLink value="#{request.contextPath}/member/member-dashboard.xhtml" styleClass="member-sidebar-link">Dashboard</h:outputLink>
                <h:outputLink value="#{request.contextPath}/member/loan-apply.xhtml" styleClass="member-sidebar-link">Apply for Loan</h:outputLink>
                <h:outputLink value="#{request.contextPath}/member/statement.xhtml" styleClass="member-sidebar-link">Statements</h:outputLink>
                <h:outputLink value="#{request.contextPath}/member/profile.xhtml" styleClass="member-sidebar-link">My Profile</h:outputLink>
            </nav>
        </aside>

        <main class="member-main-workspace">
            <header class="member-topbar">
                <div style="font-weight:700; color:#495057;">Kimwanyi SACCO Member Area</div>
                <h:form>
                    <h:commandButton value="Logout"
                                     action="#{authBean.logout()}"
                                     style="border:1px solid #dc3545; background:#ffffff; color:#dc3545; border-radius:6px; padding:8px 12px; font-weight:600; cursor:pointer;"/>
                </h:form>
            </header>

            <div class="member-content-body">
                <ui:insert name="content"/>
            </div>
        </main>
    </div>
</h:body>
</html>
