<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <title><ui:insert name="title">Admin Workspace - Kimwanyi SACCO</ui:insert></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet library="css" name="custom-style.css"/>
    <style>
        .app-container { display: flex; min-height: 100vh; background:#f4f6f5; }
        .sidebar {
            width: 270px;
            background:
                radial-gradient(circle at top left, rgba(212,160,23,0.14), transparent 34%),
                linear-gradient(180deg, #081f33 0%, #006041 100%);
            color: #fff;
            padding: 22px 0;
            flex-shrink: 0;
            box-shadow: 12px 0 34px rgba(8,31,51,0.16);
        }
        .sidebar-brand {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            padding: 0 22px 22px;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            margin-bottom: 18px;
            letter-spacing: -0.3px;
        }
        .sidebar-brand small {
            display:block;
            margin-top:5px;
            color:#f8d66d;
            font-size:12px;
            text-transform:uppercase;
            letter-spacing:0.4px;
        }
        .sidebar-menu { display: flex; flex-direction: column; gap: 14px; padding: 0 12px; }
        .sidebar-group { display:flex; flex-direction:column; gap:5px; }
        .sidebar-group-title {
            padding:0 13px;
            color:#f8d66d;
            font-size:11px;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:0.6px;
        }
        .sidebar-link {
            display: flex;
            align-items: center;
            color: #e7edf0;
            text-decoration: none;
            padding: 10px 13px;
            border-radius: 8px;
            font-weight: 600;
            font-size:14px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .sidebar-link:hover {
            background-color: rgba(255,255,255,0.13);
            border-color: rgba(212,160,23,0.28);
            color: #ffffff;
            transform: translateX(2px);
        }
        .main-workspace {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-width:0;
            background:
                radial-gradient(circle at 88% 8%, rgba(212,160,23,0.12), transparent 26%),
                linear-gradient(135deg, #ffffff 0%, #f7faf8 48%, #eef7f2 100%);
        }
        .top-navbar {
            min-height: 72px;
            background: rgba(255,255,255,0.94);
            border-bottom: 1px solid rgba(8,31,51,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 32px;
            box-shadow: 0 10px 26px rgba(8,31,51,0.06);
        }
        .content-body { padding: 32px; flex-grow: 1; }
        .admin-shell { display:flex; flex-direction:column; gap:14px; }
        .admin-compact-header {
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:14px;
            padding:0 0 4px;
            border-bottom:1px solid #e4e9e7;
        }
        .admin-compact-header h2 { margin:0; color:#081f33; font-size:24px; line-height:1.2; font-weight:600; letter-spacing:-0.3px; }
        .admin-compact-header p { margin:4px 0 0; color:#64748b; font-size:14px; line-height:1.4; }
        .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 0; }
        .metric-box {
            background: #fff;
            border-radius: 10px;
            padding: 14px;
            box-shadow: 0 4px 12px rgba(8,31,51,0.04);
            border: 1px solid #e4e9e7;
            border-top: 3px solid #006041;
        }
        .accent-metric { border-top-color:#d4a017; }
        .dark-metric { border-top-color:#081f33; }
        .metric-title { font-size: 12px; text-transform: uppercase; color: #64748b; font-weight: 500; letter-spacing: 0.35px; }
        .metric-value { font-size: 24px; font-weight: 600; color: #081f33; margin-top: 6px; letter-spacing:-0.3px; }
        .admin-page-header { margin-bottom: 25px; }
        .admin-page-header h2 { margin: 0; color: #081f33; font-size: 30px; letter-spacing: -0.7px; }
        .admin-page-header p { margin: 6px 0 0; color: #64748b; line-height:1.5; }
        .admin-card {
            background:#ffffff;
            border:1px solid #e4e9e7;
            border-radius:10px;
            padding:14px;
            box-shadow:0 4px 12px rgba(8,31,51,0.04);
        }
        .admin-card h3 { margin:0 0 10px; color:#081f33; font-size:16px; font-weight:600; }
        .admin-card p { line-height:1.45; color:#475569; font-size:13px; }
        .admin-action-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px; }
        .admin-form-card { border-top:3px solid #081f33; max-width:680px; }
        .admin-wide-form-card { max-width:none; }
        .admin-two-column-form { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px; align-items:start; }
        .admin-two-column-form .form-group { margin-bottom:0; }
        .admin-form-card.accent { border-top-color:#d4a017; }
        .admin-section-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:12px; }
        .admin-section-heading h3 { margin:0 0 4px; }
        .admin-section-heading p { margin:0; color:#64748b; font-size:13px; }
        .admin-search-row { display:flex; gap:10px; align-items:flex-end; }
        .admin-search-row > div { flex-grow:1; }
        .admin-form-card .form-group { margin-bottom:14px; }
        .admin-form-card label { display:block; margin-bottom:7px; color:#243447; font-size:13px; font-weight:600; }
        .admin-form-card .login-input,
        .admin-form-card input[type="text"] {
            display:block;
            width:100% !important;
            max-width:none !important;
            height:38px;
            box-sizing:border-box;
            border:1px solid #cfd8d3;
            border-radius:7px;
            padding:8px 10px;
            font:inherit;
            font-size:14px;
            background:#ffffff;
            color:#081f33;
        }
        .admin-form-card .login-input:focus {
            outline:none;
            border-color:#d4a017;
            box-shadow:0 0 0 3px rgba(212,160,23,0.14);
        }
        .admin-account-panel {
            background:#f8fbf9;
            border:1px solid #e4e9e7;
            border-radius:8px;
            padding:12px;
            margin:16px 0;
        }
        .admin-account-panel p { margin:0 0 7px; }
        .admin-account-panel p:last-child { margin-bottom:0; }
        .admin-success-text { color:#006041; font-weight:600; }
        .admin-danger-text { color:#842029; font-weight:600; }
        .loan-alert { background:#fff8df; color:#664d03; border:1px solid rgba(212,160,23,0.34); border-radius:8px; padding:10px 12px; font-size:13px; line-height:1.4; }
        .admin-empty-state { border:1px dashed #cfd8d3; border-radius:8px; padding:14px; color:#64748b; font-size:13px; background:#f8fbf9; }
        .admin-table-wrap { overflow-x:auto; border:1px solid rgba(8,31,51,0.08); border-radius:10px; }
        .admin-table { width:100%; border-collapse:collapse; min-width:760px; background:#ffffff; }
        .admin-table th, .admin-table td { padding:11px 12px; border-bottom:1px solid #edf0f2; text-align:left; font-size:13px; vertical-align:middle; }
        .admin-table th { background:#f8fbf9; color:#475569; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.35px; }
        .admin-table tr:last-child td { border-bottom:0; }
        .admin-table strong { color:#081f33; font-weight:600; }
        .admin-mono { font-family:Consolas, Monaco, monospace; }
        .admin-count-pill, .admin-status-pill { display:inline-flex; align-items:center; border-radius:6px; padding:4px 7px; background:#fff8df; color:#664d03; font-size:11px; font-weight:500; }
        .admin-status-active { background:#d1e7dd; color:#0f5132; }
        .admin-status-deactivated { background:#f8d7da; color:#842029; }
        .admin-danger-button { border-color:#dc3545; background:#dc3545; }
        .admin-table-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .admin-table-actions .admin-primary-button { padding:7px 10px; font-size:13px; }
        .admin-actions-col { width:170px; }
        .admin-compact-input { min-width:120px; }
        .admin-savings-layout { display:grid; grid-template-columns:minmax(260px, 0.85fr) minmax(320px, 1.15fr); gap:14px; align-items:start; }
        .admin-savings-layout .admin-account-panel { margin:0; }
        .admin-primary-button {
            border:1px solid #081f33;
            background:#081f33;
            color:#ffffff;
            border-radius:7px;
            padding:9px 13px;
            font:inherit;
            font-size:14px;
            font-weight:500;
            cursor:pointer;
        }
        .admin-primary-button:hover { filter:brightness(1.04); }
        .admin-secondary-button { border-color:#8a6500; background:#8a6500; }
        .admin-lookup-button { height:38px; white-space:nowrap; }
        .admin-logout-button {
            border:1px solid #dc3545;
            background:#ffffff;
            color:#dc3545;
            border-radius:999px;
            padding:8px 14px;
            font-weight:800;
            cursor:pointer;
        }
        .admin-logout-button:hover { background:#dc3545; color:#ffffff; }
        @media (max-width: 900px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; }
            .sidebar-menu { flex-direction: row; flex-wrap: wrap; }
            .sidebar-group { min-width:150px; }
            .top-navbar { padding: 16px 20px; align-items:flex-start; gap:12px; flex-direction:column; }
            .content-body { padding: 22px; }
            .admin-action-grid, .admin-two-column-form, .admin-savings-layout { grid-template-columns:1fr; }
            .admin-search-row { flex-direction:column; align-items:stretch; }
        }
    </style>
</h:head>
<h:body>
    <h:messages id="templateMsg"
                globalOnly="false"
                showSummary="false"
                showDetail="true"
                style="position:fixed; top:15px; right:15px; z-index:9999; list-style:none; padding:0; margin:0; max-width:360px;"
                errorStyle="display:block; background:#f8d7da; color:#842029; border:1px solid #f5c2c7; border-radius:8px; padding:10px 12px; margin-bottom:8px;"
                infoStyle="display:block; background:#d1e7dd; color:#0f5132; border:1px solid #badbcc; border-radius:8px; padding:10px 12px; margin-bottom:8px;"
                warnStyle="display:block; background:#fff3cd; color:#664d03; border:1px solid #ffecb5; border-radius:8px; padding:10px 12px; margin-bottom:8px;"/>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-brand">Kimwanyi SACCO<small>Admin Workspace</small></div>
            <nav class="sidebar-menu">
                <div class="sidebar-group">
                    <div class="sidebar-group-title">Dashboard</div>
                    <h:outputLink value="#{request.contextPath}/admin/admin-dashboard.xhtml" styleClass="sidebar-link">Overview</h:outputLink>
                </div>
                <div class="sidebar-group">
                    <div class="sidebar-group-title">Members</div>
                    <h:outputLink value="#{request.contextPath}/admin/member-list.xhtml" styleClass="sidebar-link">Member Registry</h:outputLink>
                    <h:outputLink value="#{request.contextPath}/admin/member-register.xhtml" styleClass="sidebar-link">Register Member</h:outputLink>
                </div>
                <div class="sidebar-group">
                    <div class="sidebar-group-title">Savings</div>
                    <h:outputLink value="#{request.contextPath}/admin/cash-deposit.xhtml" styleClass="sidebar-link">Post Deposit</h:outputLink>
                    <h:outputLink value="#{request.contextPath}/admin/cash-withdrawal.xhtml" styleClass="sidebar-link">Post Withdrawal</h:outputLink>
                </div>
                <div class="sidebar-group">
                    <div class="sidebar-group-title">Loans</div>
                    <h:outputLink value="#{request.contextPath}/admin/loan-application.xhtml" styleClass="sidebar-link">Applications</h:outputLink>
                    <h:outputLink value="#{request.contextPath}/admin/loan-repayment.xhtml" styleClass="sidebar-link">Repayments</h:outputLink>
                    <h:outputLink value="#{request.contextPath}/admin/loan-overdue.xhtml" styleClass="sidebar-link">Overdue Loans</h:outputLink>
                </div>
            </nav>
        </aside>

        <main class="main-workspace">
            <header class="top-navbar">
                <div style="font-weight:800; font-size:18px; color:#081f33;">
                    Admin Area
                </div>
                <h:form>
                    <div style="display:flex; align-items:center; gap:15px;">
                        <span style="font-weight:500;">Welcome, #{authBean.loggedInUser.fullName}</span>
                        <h:commandButton value="Logout"
                                         action="#{authBean.logout()}"
                                         styleClass="admin-logout-button"/>
                    </div>
                </h:form>
            </header>

            <div class="content-body">
                <ui:insert name="content"/>
            </div>
        </main>
    </div>
    <script>
        window.setTimeout(function () {
            var messages = document.getElementById('templateMsg');
            if (!messages) return;
            messages.style.transition = 'opacity 0.25s ease';
            messages.style.opacity = '0';
            window.setTimeout(function () {
                messages.style.display = 'none';
            }, 250);
        }, 5000);
    </script>
</h:body>
</html>
