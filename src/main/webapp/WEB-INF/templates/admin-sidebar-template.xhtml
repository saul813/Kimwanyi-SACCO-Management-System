<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <title><ui:insert name="title">Admin Workspace - Kimwanyi SACCO</ui:insert></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet library="css" name="custom-style.css"/>
    <style>
        .app-container { display: flex; min-height: 100vh; background:#f4f6f5; }
        .sidebar {
            width: 270px;
            background:
                radial-gradient(circle at top left, rgba(212,160,23,0.14), transparent 34%),
                linear-gradient(180deg, #081f33 0%, #006041 100%);
            color: #fff;
            padding: 22px 0;
            flex-shrink: 0;
            box-shadow: 12px 0 34px rgba(8,31,51,0.16);
        }
        .sidebar-brand {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            padding: 0 22px 22px;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            margin-bottom: 18px;
            letter-spacing: -0.3px;
        }
        .sidebar-brand small {
            display:block;
            margin-top:5px;
            color:#f8d66d;
            font-size:12px;
            text-transform:uppercase;
            letter-spacing:0.4px;
        }
        .sidebar-menu { display: flex; flex-direction: column; gap: 7px; padding: 0 12px; }
        .sidebar-link {
            display: flex;
            align-items: center;
            color: #e7edf0;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 999px;
            font-weight: 700;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .sidebar-link:hover {
            background-color: rgba(255,255,255,0.13);
            border-color: rgba(212,160,23,0.28);
            color: #ffffff;
            transform: translateX(2px);
        }
        .main-workspace { flex-grow: 1; display: flex; flex-direction: column; background-color: #f4f6f5; min-width:0; }
        .top-navbar {
            min-height: 72px;
            background: rgba(255,255,255,0.94);
            border-bottom: 1px solid rgba(8,31,51,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 32px;
            box-shadow: 0 10px 26px rgba(8,31,51,0.06);
        }
        .content-body { padding: 32px; flex-grow: 1; }
        .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 28px; }
        .metric-box {
            background: #fff;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 14px 34px rgba(8,31,51,0.07);
            border: 1px solid rgba(8,31,51,0.07);
            border-top: 4px solid #006041;
        }
        .metric-title { font-size: 12px; text-transform: uppercase; color: #64748b; font-weight: 800; letter-spacing: 0.6px; }
        .metric-value { font-size: 26px; font-weight: 800; color: #081f33; margin-top: 8px; }
        .admin-page-header { margin-bottom: 25px; }
        .admin-page-header h2 { margin: 0; color: #081f33; font-size: 30px; letter-spacing: -0.7px; }
        .admin-page-header p { margin: 6px 0 0; color: #64748b; line-height:1.5; }
        .admin-card {
            margin-top: 20px;
            background:#ffffff;
            border:1px solid rgba(8,31,51,0.08);
            border-radius:20px;
            padding:24px;
            box-shadow:0 14px 34px rgba(8,31,51,0.07);
        }
        .admin-card h3 { margin:0 0 10px; color:#081f33; }
        .admin-card p { line-height:1.6; color:#475569; }
        .admin-primary-button {
            border:0;
            background:#006041;
            color:#ffffff;
            border-radius:999px;
            padding:11px 18px;
            font-weight:800;
            cursor:pointer;
        }
        .admin-primary-button:hover { background:#004d34; }
        .admin-logout-button {
            border:1px solid #dc3545;
            background:#ffffff;
            color:#dc3545;
            border-radius:999px;
            padding:8px 14px;
            font-weight:800;
            cursor:pointer;
        }
        .admin-logout-button:hover { background:#dc3545; color:#ffffff; }
        @media (max-width: 900px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; }
            .sidebar-menu { flex-direction: row; flex-wrap: wrap; }
            .top-navbar { padding: 16px 20px; align-items:flex-start; gap:12px; flex-direction:column; }
            .content-body { padding: 22px; }
        }
    </style>
</h:head>
<h:body>
    <h:messages id="templateMsg"
                globalOnly="false"
                showSummary="false"
                showDetail="true"
                style="position:fixed; top:15px; right:15px; z-index:9999; list-style:none; padding:0; margin:0; max-width:360px;"
                errorStyle="display:block; background:#f8d7da; color:#842029; border:1px solid #f5c2c7; border-radius:8px; padding:10px 12px; margin-bottom:8px;"
                infoStyle="display:block; background:#d1e7dd; color:#0f5132; border:1px solid #badbcc; border-radius:8px; padding:10px 12px; margin-bottom:8px;"
                warnStyle="display:block; background:#fff3cd; color:#664d03; border:1px solid #ffecb5; border-radius:8px; padding:10px 12px; margin-bottom:8px;"/>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-brand">Kimwanyi SACCO<small>Admin Workspace</small></div>
            <nav class="sidebar-menu">
                <h:outputLink value="#{request.contextPath}/admin/admin-dashboard.xhtml" styleClass="sidebar-link">Overview Dashboard</h:outputLink>
                <h:outputLink value="#{request.contextPath}/admin/member-list.xhtml" styleClass="sidebar-link">Member Registries</h:outputLink>
                <h:outputLink value="#{request.contextPath}/admin/member-register.xhtml" styleClass="sidebar-link">Register Member</h:outputLink>
                <h:outputLink value="#{request.contextPath}/admin/cash-deposit.xhtml" styleClass="sidebar-link">Post Cash Deposit</h:outputLink>
                <h:outputLink value="#{request.contextPath}/admin/cash-withdrawal.xhtml" styleClass="sidebar-link">Cash Withdrawal</h:outputLink>
                <h:outputLink value="#{request.contextPath}/admin/loan-application.xhtml" styleClass="sidebar-link">Loan Applications</h:outputLink>
                <h:outputLink value="#{request.contextPath}/admin/loan-repayment.xhtml" styleClass="sidebar-link">Loan Repayments</h:outputLink>
                <h:outputLink value="#{request.contextPath}/admin/loan-overdue.xhtml" styleClass="sidebar-link">Overdue Loans</h:outputLink>
            </nav>
        </aside>

        <main class="main-workspace">
            <header class="top-navbar">
                <div style="font-weight:800; font-size:18px; color:#081f33;">
                    Admin Area
                </div>
                <h:form>
                    <div style="display:flex; align-items:center; gap:15px;">
                        <span style="font-weight:500;">Welcome, #{authBean.loggedInUser.fullName}</span>
                        <h:commandButton value="Logout"
                                         action="#{authBean.logout()}"
                                         styleClass="admin-logout-button"/>
                    </div>
                </h:form>
            </header>

            <div class="content-body">
                <ui:insert name="content"/>
            </div>
        </main>
    </div>
    <script>
        window.setTimeout(function () {
            var messages = document.getElementById('templateMsg');
            if (!messages) return;
            messages.style.transition = 'opacity 0.25s ease';
            messages.style.opacity = '0';
            window.setTimeout(function () {
                messages.style.display = 'none';
            }, 250);
        }, 5000);
    </script>
</h:body>
</html>
