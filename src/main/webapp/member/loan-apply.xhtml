<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/member-sidebar-template.xhtml">

    <ui:define name="title">Apply for Loan - Kimwanyi SACCO</ui:define>

    <ui:define name="content">
        <div style="margin-bottom:25px;">
            <h2 style="margin:0; color:#212529;">Apply for a Loan</h2>
            <p style="margin:5px 0 0 0; color:#6c757d;">Submit a member credit request for administrative review.</p>
        </div>

        <section class="member-card" style="max-width:650px;">
            <h3>Request New Community Empowerment Loan</h3>
            <h:form id="loanRequestForm">
                <div style="background:#eff6ff; padding:15px; border-radius:6px; margin-bottom:20px; border:1px solid #bfdbfe; font-size:14px; line-height:1.5; color:#1e40af;">
                    <strong>Underwriting Rules:</strong> Maximum credit ceiling is <strong>3x your active savings balance</strong>. Fresh borrowing is blocked if you have an unresolved active loan.
                </div>

                <div class="form-group">
                    <h:outputLabel for="loanAmount" value="Desired Principal Value (UGX)"/>
                    <h:inputText id="loanAmount" value="#{memberPortalBean.requestedLoanPrincipal}"
                                 required="true"
                                 requiredMessage="Please specify a valid loan principal amount value."
                                 styleClass="login-input"
                                 style="display:block; width:100%; height:44px; box-sizing:border-box; border:1px solid #ced4da; border-radius:8px; padding:10px 12px; font-size:15px; font-family:inherit; background:#ffffff; color:#212529;"/>
                </div>

                <div class="form-actions">
                    <h:commandButton value="Submit Online Credit Application"
                                     action="#{memberPortalBean.applyForLoan()}"
                                     styleClass="login-native-submit"
                                     style="display:block; width:100%; min-height:44px; box-sizing:border-box; border:1px solid #0d6efd; border-radius:8px; background:#0d6efd; color:#ffffff; font-family:inherit; font-size:16px; font-weight:700; cursor:pointer;"/>
                </div>
            </h:form>
        </section>
    </ui:define>
</ui:composition>
