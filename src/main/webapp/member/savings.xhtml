<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/templates/member-sidebar-template.xhtml">

    <ui:define name="title">Savings - Kimwanyi SACCO</ui:define>

    <ui:define name="content">
        <div style="margin-bottom:25px;">
            <h2 style="margin:0; color:#212529;">Savings Transactions</h2>
            <p style="margin:5px 0 0 0; color:#6c757d;">Deposit, withdraw, view balance, and estimate savings interest.</p>
        </div>

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:24px;">
            <section class="member-card" style="border-left:5px solid #198754;">
                <h3>Current Savings Balance</h3>
                <p>Account: <code>#{memberPortalBean.activeAccountNumber}</code></p>
                <h2 style="font-size:32px; color:#198754; margin:0;">
                    UGX <h:outputText value="#{memberPortalBean.activeAccountBalance}"><f:convertNumber pattern="#,##0.00"/></h:outputText>
                </h2>
                <p style="color:#6c757d;">Minimum balance maintained: UGX 20,000</p>
                <p style="color:#0d6efd; font-weight:700;">
                    Estimated monthly interest: UGX <h:outputText value="#{memberPortalBean.estimatedMonthlySavingsInterest}"><f:convertNumber pattern="#,##0.00"/></h:outputText>
                </p>
            </section>

            <section class="member-card">
                <h3>Post Deposit / Withdrawal</h3>
                <h:form id="savingsForm">
                    <div class="form-group">
                        <h:outputLabel for="amount" value="Amount (UGX)"/>
                        <h:inputText id="amount" value="#{memberPortalBean.savingsTransactionAmount}" required="true"
                                     requiredMessage="Amount is required."
                                     styleClass="login-input"
                                     style="display:block; width:100%; height:44px; box-sizing:border-box; border:1px solid #ced4da; border-radius:8px; padding:10px 12px;"/>
                    </div>
                    <div class="form-group">
                        <h:outputLabel for="description" value="Description / Reference"/>
                        <h:inputText id="description" value="#{memberPortalBean.savingsTransactionDescription}"
                                     styleClass="login-input"
                                     style="display:block; width:100%; height:44px; box-sizing:border-box; border:1px solid #ced4da; border-radius:8px; padding:10px 12px;"/>
                    </div>
                    <div style="display:flex; gap:10px; flex-wrap:wrap;">
                        <h:commandButton value="Deposit"
                                         action="#{memberPortalBean.processMemberDeposit()}"
                                         style="border:0; background:#198754; color:#fff; border-radius:6px; padding:10px 14px; font-weight:700; cursor:pointer;"/>
                        <h:commandButton value="Withdraw"
                                         action="#{memberPortalBean.processMemberWithdrawal()}"
                                         style="border:0; background:#dc3545; color:#fff; border-radius:6px; padding:10px 14px; font-weight:700; cursor:pointer;"/>
                    </div>
                </h:form>
            </section>
        </div>
    </ui:define>
</ui:composition>
