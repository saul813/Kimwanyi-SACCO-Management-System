<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/templates/member-sidebar-template.xhtml">

    <ui:define name="title">Statements - Kimwanyi SACCO</ui:define>

    <ui:define name="content">
        <div style="margin-bottom:25px;">
            <h2 style="margin:0; color:#212529;">Account Ledger Statement</h2>
            <p style="margin:5px 0 0 0; color:#6c757d;">Review historical deposits, withdrawals, and interest credits.</p>
        </div>

        <section class="member-card">
            <table class="simple-table">
                <thead>
                <tr>
                    <th>Transaction Timestamp</th>
                    <th>Description</th>
                    <th>Type</th>
                    <th style="text-align:right;">Amount (UGX)</th>
                </tr>
                </thead>
                <tbody>
                <ui:repeat value="#{memberPortalBean.statementHistory}" var="tx">
                    <tr>
                        <td><h:outputText value="#{tx.createdAt}"><f:convertDateTime pattern="dd-MMM-yyyy HH:mm"/></h:outputText></td>
                        <td>#{tx.description}</td>
                        <td><span class="status-pill">#{tx.transactionType}</span></td>
                        <td style="text-align:right; font-weight:700;"><h:outputText value="#{tx.amount}"><f:convertNumber pattern="#,##0.00"/></h:outputText></td>
                    </tr>
                </ui:repeat>
                </tbody>
            </table>
            <h:panelGroup rendered="#{empty memberPortalBean.statementHistory}">
                <p style="color:#6c757d; margin-bottom:0;">No statement transactions are available yet.</p>
            </h:panelGroup>
        </section>
    </ui:define>
</ui:composition>
